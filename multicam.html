<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Multicámara - AngulismoTV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
  
  <style>
    /* === ESTILO RETRO GALÁCTICO === */
    :root {
      --bg-dark: #000010;
      --bg-card: rgba(0, 10, 40, 0.7);
      --text-primary: #ffffff;
      --text-secondary: #00eaff;
      --accent: #00ffff;
      --accent-purple: #ff00ff;
      --border-color: rgba(255,255,255,0.2);
      --radius: 12px;
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: url('https://cur.cursors-4u.net/games/gam-14/gam1361.cur'), auto;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: url('https://i.gifer.com/3fFv.gif') center/cover fixed, radial-gradient(circle at top, #020220, #000010);
      color: var(--text-primary);
      font-family: 'Orbitron', sans-serif;
      overflow-x: hidden;
      position: relative;
      margin: 0;
    }

    /* Fondo de estrellas animadas */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #starfield .star {
      position: absolute;
      background: linear-gradient(45deg, #00ffff, #ff00ff);
      border-radius: 50%;
      box-shadow: 0 0 6px #00ffffaa;
      opacity: 0.8;
      animation: twinkle 2.5s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* HEADER brillante */
    header {
      background: rgba(0,0,30,0.9);
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 0 25px var(--accent);
      padding: 14px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      text-transform: uppercase;
      font-family: 'Press Start 2P', cursive;
    }

    .logo {
      height: 50px;
      filter: drop-shadow(0 0 8px var(--accent));
      transition: var(--transition);
    }

    .logo:hover {
      transform: scale(1.1);
      filter: drop-shadow(0 0 16px var(--accent-purple));
    }

    nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    nav a {
      background: rgba(0,0,40,0.7);
      border: 2px solid var(--accent);
      color: var(--text-secondary);
      padding: 8px 12px;
      text-decoration: none;
      font-size: 0.7rem;
      border-radius: 8px;
      transition: var(--transition);
      text-shadow: 0 0 4px var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    nav a:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 15px var(--accent);
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem;
      position: relative;
      z-index: 2;
    }

    main {
      padding: 1.5rem 0;
    }

    /* Controles de multicámara con estilo retro */
    .multicam-controls {
      background: linear-gradient(135deg, rgba(0,0,40,0.8), rgba(20,0,40,0.8));
      border: 2px solid var(--accent);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 20px var(--accent);
    }

    .controls-header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .layout-selector {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 300px;
    }

    .layout-dropdown-btn {
      background: rgba(0,0,40,0.9);
      border: 2px solid var(--accent);
      color: var(--text-secondary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      font-weight: 600;
      box-shadow: 0 0 10px var(--accent);
      text-shadow: 0 0 4px var(--accent);
      font-family: 'Orbitron', sans-serif;
    }

    .layout-dropdown-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 20px var(--accent);
      transform: translateY(-2px);
    }

    .layout-dropdown-btn::after {
      content: '▼';
      font-size: 0.8rem;
      transition: var(--transition);
    }

    .layout-dropdown-btn.active::after {
      transform: rotate(180deg);
    }

    .layout-dropdown-content {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(0,0,40,0.95);
      border: 2px solid var(--accent);
      border-radius: 8px;
      margin-top: 0.5rem;
      z-index: 100;
      display: none;
      box-shadow: 0 0 25px var(--accent);
      backdrop-filter: blur(12px);
    }

    .layout-dropdown-content.show {
      display: block;
    }

    .layout-option {
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
      text-shadow: 0 0 4px var(--accent);
    }

    .layout-option:hover {
      background: rgba(0,255,255,0.2);
      box-shadow: inset 0 0 15px var(--accent);
    }

    .layout-option:last-child {
      border-bottom: none;
    }

    .fullscreen-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-purple));
      border: 2px solid var(--accent);
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex: 1;
      min-width: 200px;
      max-width: 300px;
      box-shadow: 0 0 20px var(--accent);
      text-transform: uppercase;
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
    }

    .fullscreen-btn:hover {
      box-shadow: 0 0 30px var(--accent-purple);
      transform: translateY(-3px);
    }

    .exit-fullscreen-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,40,0.9);
      border: 2px solid var(--accent);
      color: var(--text-secondary);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      z-index: 10000;
      display: none;
      align-items: center;
      gap: 0.5rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 30px var(--accent);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.7rem;
      text-shadow: 0 0 4px var(--accent);
    }

    .exit-fullscreen-btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 40px var(--accent-purple);
    }

    .stream-selector {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.75rem;
      width: 100%;
    }

    .stream-dropdown {
      position: relative;
    }

    .dropdown-btn {
      background: rgba(0,0,40,0.9);
      border: 2px solid var(--accent);
      color: var(--text-secondary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
      font-size: 0.85rem;
      box-shadow: 0 0 10px var(--accent);
      text-shadow: 0 0 4px var(--accent);
      font-family: 'Orbitron', sans-serif;
    }

    .dropdown-btn:hover {
      background: rgba(0,255,255,0.2);
      box-shadow: 0 0 20px var(--accent);
      transform: translateY(-1px);
    }

    .dropdown-btn::after {
      content: '▼';
      font-size: 0.8rem;
      transition: var(--transition);
    }

    .dropdown-btn.active::after {
      transform: rotate(180deg);
    }

    .dropdown-content {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(0,0,40,0.95);
      border: 2px solid var(--accent);
      border-radius: 8px;
      margin-top: 0.5rem;
      max-height: 300px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      box-shadow: 0 0 25px var(--accent);
      backdrop-filter: blur(12px);
    }

    .dropdown-content::-webkit-scrollbar {
      width: 8px;
    }

    .dropdown-content::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
    }

    .dropdown-content::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
      box-shadow: 0 0 6px var(--accent);
    }

    .dropdown-content.show {
      display: block;
    }

    .stream-option {
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 1px solid var(--border-color);
    }

    .stream-option:hover {
      background: rgba(0,255,255,0.2);
      box-shadow: inset 0 0 15px var(--accent);
    }

    .stream-option:last-child {
      border-bottom: none;
    }

    .stream-info {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .stream-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-shadow: 0 0 4px var(--accent);
    }

    .stream-meta {
      font-size: 0.75rem;
      color: var(--accent);
      opacity: 0.8;
    }

    /* Grid de pantallas */
    .streams-grid {
      display: grid;
      gap: 1rem;
      margin-bottom: 1.5rem;
      min-height: 400px;
    }

    .layout-1 { grid-template-columns: 1fr; }
    .layout-2 { grid-template-columns: 1fr 1fr; }
    .layout-3 { 
      grid-template-columns: 1fr 1fr; 
      grid-template-rows: 1fr 1fr;
    }
    .layout-3 .stream-item:nth-child(1) { 
      grid-column: 1 / -1; 
    }
    .layout-4 { 
      grid-template-columns: 1fr 1fr; 
      grid-template-rows: 1fr 1fr;
    }

    .stream-item {
      background: linear-gradient(135deg, rgba(0,0,40,0.8), rgba(20,0,40,0.8));
      border: 2px solid #00ffffaa;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 0 15px #00ffff55;
      transition: var(--transition);
      position: relative;
    }

    .stream-item.active {
      border-color: var(--accent-purple);
      box-shadow: 0 0 25px var(--accent-purple);
    }

    .stream-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px var(--accent);
    }

    .stream-header {
      background: rgba(0,0,40,0.9);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent);
    }

    .stream-title-bar {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-shadow: 0 0 5px var(--accent);
      font-family: 'Press Start 2P', cursive;
      font-size: 0.65rem;
    }

    .stream-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      color: var(--text-secondary);
      flex-direction: column;
      gap: 1rem;
      font-size: 1rem;
      text-shadow: 0 0 8px var(--accent);
    }

    .stream-placeholder span:first-child {
      font-size: 3rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }

    .stream-iframe {
      width: 100%;
      height: 400px;
      border: none;
      background: #000;
    }

    .layout-2 .stream-iframe,
    .layout-3 .stream-iframe,
    .layout-4 .stream-iframe {
      height: 300px;
    }

    /* Modo pantalla completa */
    body.fullscreen-mode {
      overflow: hidden;
    }

    body.fullscreen-mode .streams-grid {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9999;
      background: #000;
      margin: 0;
      padding: 1rem;
      display: grid;
    }

    body.fullscreen-mode .multicam-controls {
      display: none;
    }

    body.fullscreen-mode header,
    body.fullscreen-mode footer {
      display: none;
    }

    body.fullscreen-mode .exit-fullscreen-btn {
      display: flex;
    }

    body.fullscreen-mode .layout-1 .stream-iframe { height: calc(100vh - 100px); }
    body.fullscreen-mode .layout-2 .stream-iframe { height: calc(50vh - 60px); }
    body.fullscreen-mode .layout-3 .stream-iframe { height: calc(50vh - 60px); }
    body.fullscreen-mode .layout-3 .stream-item:nth-child(1) .stream-iframe { height: calc(50vh - 60px); }
    body.fullscreen-mode .layout-4 .stream-iframe { height: calc(50vh - 60px); }

    /* Footer */
    footer.site-footer {
      background: rgba(0,0,30,0.9);
      border-top: 2px solid var(--accent);
      padding: 1.5rem 0;
      box-shadow: 0 0 20px var(--accent);
      text-align: center;
      position: relative;
      z-index: 2;
      margin-top: 2rem;
    }

    footer.site-footer small {
      color: var(--accent);
      display: block;
      text-shadow: 0 0 5px var(--accent-purple);
      margin: 0.25rem 0;
    }

    footer.site-footer a {
      color: var(--accent-purple);
      text-decoration: none;
    }

    footer.site-footer a:hover {
      text-decoration: underline;
      text-shadow: 0 0 6px var(--accent);
    }

    /* Animación de texto retro */
    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
        text-shadow: 0 0 4px #00ffff, 0 0 10px #00ffff, 0 0 20px #ff00ff;
      }
      20%, 24%, 55% {
        opacity: 0.4;
        text-shadow: none;
      }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .layout-2,
      .layout-3,
      .layout-4 {
        grid-template-columns: 1fr;
      }

      .layout-3 .stream-item:nth-child(1) { 
        grid-column: 1; 
      }
      
      .controls-row {
        flex-direction: column;
        align-items: stretch;
      }
      
      .layout-selector,
      .fullscreen-btn {
        max-width: 100%;
      }
      
      .stream-selector {
        grid-template-columns: 1fr;
      }
      
      .stream-iframe {
        height: 250px;
      }

      body.fullscreen-mode .streams-grid {
        padding: 0.5rem;
      }
      
      body.fullscreen-mode .layout-1 .stream-iframe { height: calc(100vh - 80px); }
      body.fullscreen-mode .layout-2 .stream-iframe,
      body.fullscreen-mode .layout-3 .stream-iframe,
      body.fullscreen-mode .layout-4 .stream-iframe { height: calc(50vh - 50px); }
    }

    @media (max-width: 480px) {
      header {
        flex-direction: column;
        gap: 10px;
        padding: 10px 4%;
      }
      
      nav {
        justify-content: center;
      }
      
      nav a {
        font-size: 0.6rem;
        padding: 6px 10px;
      }
      
      .logo {
        height: 45px;
      }
      
      .multicam-controls {
        padding: 1rem;
      }

      .fullscreen-btn {
        font-size: 0.6rem;
        padding: 0.65rem 1rem;
      }

      .exit-fullscreen-btn {
        top: 10px;
        right: 10px;
        padding: 0.75rem 1rem;
        font-size: 0.6rem;
      }

      .stream-title-bar {
        font-size: 0.55rem;
      }
    }
  </style>
</head>

<body>
<div id="starfield"></div>

<header>
  <a href="index.html">
    <img src="assets/logo2.png" alt="AngulismoTV" class="logo">
  </a>
  <nav>
    <a href="index.html#channelsSection">Canales</a>
    <a href="index.html">Agenda</a>
    <a href="multicam.html">Pantalla Dividida</a>
    <a href="https://nowevents.xyz" target="_blank">Entretenimiento</a>
    <a href="https://nowstats.netlify.app" target="_blank">Estadisticas (beta)</a>
  </nav>
</header>

<main class="container">
  <div class="multicam-controls">
    <div class="controls-header">
      <div class="controls-row">
        <div class="layout-selector">
          <button class="layout-dropdown-btn" id="layoutDropdownBtn">
            1 Pantalla
          </button>
          <div class="layout-dropdown-content" id="layoutDropdown">
            <div class="layout-option" data-layout="1">1 Pantalla</div>
            <div class="layout-option" data-layout="2">2 Pantallas</div>
            <div class="layout-option" data-layout="3">3 Pantallas</div>
            <div class="layout-option" data-layout="4">4 Pantallas</div>
          </div>
        </div>
        
        <button class="fullscreen-btn" id="globalFullscreen">
          <span>⛶</span>
          Pantalla Completa
        </button>
      </div>
      
      <div class="stream-selector">
        <div class="stream-dropdown">
          <button class="dropdown-btn" data-slot="1">Seleccionar evento 1</button>
          <div class="dropdown-content" id="dropdown-1"></div>
        </div>
        
        <div class="stream-dropdown" style="display: none;" id="dropdown-container-2">
          <button class="dropdown-btn" data-slot="2">Seleccionar evento 2</button>
          <div class="dropdown-content" id="dropdown-2"></div>
        </div>
        
        <div class="stream-dropdown" style="display: none;" id="dropdown-container-3">
          <button class="dropdown-btn" data-slot="3">Seleccionar evento 3</button>
          <div class="dropdown-content" id="dropdown-3"></div>
        </div>
        
        <div class="stream-dropdown" style="display: none;" id="dropdown-container-4">
          <button class="dropdown-btn" data-slot="4">Seleccionar evento 4</button>
          <div class="dropdown-content" id="dropdown-4"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="streams-grid layout-1" id="streamsGrid">
    <div class="stream-item active" id="stream-1">
      <div class="stream-header">
        <div class="stream-title-bar">
          <strong>Pantalla 1</strong>
        </div>
      </div>
      <div class="stream-placeholder">
        <span>📺</span>
        <span>Selecciona un evento para comenzar</span>
      </div>
    </div>
  </div>
</main>

<button class="exit-fullscreen-btn" id="exitFullscreenBtn">
  <span>✕</span>
  Salir
</button>

<footer class="site-footer">
  <div class="container">
    <small>© 2025 | <a href="dmca.html">DMCA</a></small>
    <small><a href="https://x.com/AngulismoTV">Twitter</a> | <a href="https://discord.gg/jEayDA7T">Discord</a></small>
  </div>
</footer>

<script>
  // Genera estrellas animadas
  const starfield = document.getElementById('starfield');
  const numStars = 80;
  for(let i=0; i<numStars; i++){
    const star = document.createElement('div');
    star.className='star';
    const size = Math.random()*2+1;
    star.style.width = star.style.height = size+'px';
    star.style.top = Math.random()*100+'%';
    star.style.left = Math.random()*100+'%';
    star.style.animationDelay = Math.random()*3+'s';
    starfield.appendChild(star);
  }

  // === FUNCIONALIDAD MULTICÁMARA ===
  const EVENTOS_JSON = 'https://json.angulismotv.workers.dev/events';
  const STREAMTP_EVENTOS = 'https://streamtp.angulismotv.workers.dev/eventos.json';
  const LA14HD_EVENTOS = 'https://la14hd.angulismotv.workers.dev/eventos/json/agenda123.json';

  let agendaStreams = [];
  let currentLayout = 1;
  let activeStreams = {};
  let isFullscreen = false;

  async function fetchJSON(url, options = {}) {
    try {
      const response = await fetch(url, {
        cache: 'no-store',
        mode: 'cors',
        ...options
      });
      if (!response.ok) throw new Error('Error al cargar ' + url);
      return await response.json();
    } catch (error) {
      console.error(`Error fetching ${url}:`, error);
      return null;
    }
  }

  function getDirectPlayerUrl(streamData) {
    if (!streamData || !streamData.tv_networks || streamData.tv_networks.length === 0) {
      return null;
    }

    const network = streamData.tv_networks[0];
    
    if (network.link) {
      try {
        const decodedLink = atob(network.link);
        return decodedLink;
      } catch (e) {
        console.error('Error decoding base64 link:', e);
        return null;
      }
    }
    
    return null;
  }

  async function adaptManualEvents(events) {
    if (!Array.isArray(events)) return [];
    
    return events.map(ev => {
      let teams = [];
      if (ev.evento && ev.evento.includes(' vs ')) {
        teams = ev.evento.split(' vs ').map(name => ({ name: name.trim() }));
      } else if (ev.evento) {
        teams = [{ name: ev.evento.trim() }];
      }
      
      let canales = Array.isArray(ev.canales) ? ev.canales : (ev.canal ? [ev.canal] : []);
      return {
        id: ev.id || `manual-${Date.now()}-${Math.random()}`,
        start_time: ev.fecha || '',
        teams: teams,
        evento: ev.evento || 'Sin título',
        description: ev.descripcion || '',
        competition_name: ev.competencia || '',
        tv_networks: canales.map(c => {
          if (typeof c === 'object' && c.name) {
            return c;
          }
          return { name: c };
        }),
        status: { name: ev.estado || '' }
      };
    });
  }

  async function adaptStreamTPEvents(events) {
    if (!Array.isArray(events)) return [];
    
    return events.map((ev, idx) => {
      let teams = [];
      if (ev.title && ev.title.includes(' vs ')) {
        teams = ev.title.split(' vs ').map(name => ({ name: name.trim() }));
      } else if (ev.title) {
        teams = [{ name: ev.title.trim() }];
      }
      
      const canales = [];
      if (ev.link) {
        canales.push({
          name: ev.category || 'Canal',
          link: btoa(ev.link)
        });
      }
      
      return {
        id: `streamtp-${Date.now()}-${idx}`,
        start_time: ev.time || '',
        teams: teams,
        evento: ev.title || 'Sin título',
        description: ev.status || '',
        competition_name: ev.category || '',
        tv_networks: canales,
        status: { name: ev.status || '' }
      };
    });
  }

  async function adaptLA14HDEvents(events) {
    if (!Array.isArray(events)) return [];
    
    return events.map((ev, idx) => {
      let teams = [];
      if (ev.title && ev.title.includes(' vs ')) {
        teams = ev.title.split(' vs ').map(name => ({ name: name.trim() }));
      } else if (ev.title) {
        teams = [{ name: ev.title.trim() }];
      }
      
      const canales = [];
      if (ev.link) {
        canales.push({
          name: ev.category || 'Canal',
          link: btoa(ev.link)
        });
      }
      
      return {
        id: `la14hd-${Date.now()}-${idx}`,
        start_time: ev.time || '',
        teams: teams,
        evento: ev.title || 'Sin título',
        description: ev.status || '',
        competition_name: ev.category || '',
        tv_networks: canales,
        status: { name: ev.status || '' }
      };
    });
  }

  async function loadAgendaData() {
    try {
      const [manualEventsRaw, streamTPEventsRaw, la14HDEventsRaw] = await Promise.all([
        fetchJSON(EVENTOS_JSON),
        fetchJSON(STREAMTP_EVENTOS),
        fetchJSON(LA14HD_EVENTOS)
      ]);

      const manualEvents = await adaptManualEvents(Array.isArray(manualEventsRaw) ? manualEventsRaw : []);
      
      let streamTPArray = [];
      if (streamTPEventsRaw && Array.isArray(streamTPEventsRaw)) {
        streamTPArray = streamTPEventsRaw;
      } else if (streamTPEventsRaw && streamTPEventsRaw.Events) {
        streamTPArray = streamTPEventsRaw.Events;
      }
      
      let la14HDArray = [];
      if (la14HDEventsRaw && Array.isArray(la14HDEventsRaw)) {
        la14HDArray = la14HDEventsRaw;
      } else if (la14HDEventsRaw && la14HDEventsRaw.Events) {
        la14HDArray = la14HDEventsRaw.Events;
      }

      const streamTPEvents = await adaptStreamTPEvents(streamTPArray);
      const la14HDEvents = await adaptLA14HDEvents(la14HDArray);

      agendaStreams = [...manualEvents, ...streamTPEvents, ...la14HDEvents];
      
      console.log('Eventos cargados:', agendaStreams.length);
      loadStreamOptions();
      
    } catch (error) {
      console.error('Error cargando datos:', error);
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    loadAgendaData();
    setupEventListeners();
  });

  function loadStreamOptions() {
    for (let i = 1; i <= 4; i++) {
      const dropdown = document.getElementById(`dropdown-${i}`);
      if (dropdown) dropdown.innerHTML = '';
    }

    agendaStreams.forEach(stream => {
      for (let i = 1; i <= 4; i++) {
        const dropdown = document.getElementById(`dropdown-${i}`);
        if (dropdown) {
          const option = document.createElement('div');
          option.className = 'stream-option';
          option.innerHTML = `
            <div class="stream-info">
              <div class="stream-title">${stream.evento}</div>
              <div class="stream-meta">${stream.competition_name} • ${formatTime(stream.start_time)}</div>
            </div>
          `;
          option.addEventListener('click', () => selectStream(i, stream));
          dropdown.appendChild(option);
        }
      }
    });
  }

  function formatTime(str) {
    if (!str) return '--:--';
    if (str.includes(' ')) {
      const parts = str.split(' ');
      return parts[1] || '--:--';
    }
    return str.includes(':') ? str : '--:--';
  }

  function setupEventListeners() {
    const layoutDropdownBtn = document.getElementById('layoutDropdownBtn');
    const layoutDropdown = document.getElementById('layoutDropdown');
    
    layoutDropdownBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      layoutDropdown.classList.toggle('show');
      this.classList.toggle('active');
    });

    document.querySelectorAll('.layout-option').forEach(option => {
      option.addEventListener('click', function() {
        const layout = parseInt(this.dataset.layout);
        changeLayout(layout);
        layoutDropdownBtn.textContent = this.textContent;
        layoutDropdown.classList.remove('show');
        layoutDropdownBtn.classList.remove('active');
      });
    });

    document.querySelectorAll('.dropdown-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const slot = this.dataset.slot;
        toggleStreamDropdown(slot);
      });
    });

    document.getElementById('globalFullscreen').addEventListener('click', toggleGlobalFullscreen);
    document.getElementById('exitFullscreenBtn').addEventListener('click', toggleGlobalFullscreen);

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.layout-selector')) {
        layoutDropdown.classList.remove('show');
        layoutDropdownBtn.classList.remove('active');
      }
      if (!e.target.closest('.stream-dropdown')) {
        closeAllStreamDropdowns();
      }
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && isFullscreen) {
        toggleGlobalFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', handleFullscreenChange);
    document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
    document.addEventListener('mozfullscreenchange', handleFullscreenChange);
    document.addEventListener('MSFullscreenChange', handleFullscreenChange);
  }

  function handleFullscreenChange() {
    const fullscreenElement = document.fullscreenElement || 
                             document.webkitFullscreenElement || 
                             document.mozFullScreenElement || 
                             document.msFullscreenElement;
    
    if (!fullscreenElement && isFullscreen) {
      toggleGlobalFullscreen();
    }
  }

  function closeAllStreamDropdowns() {
    document.querySelectorAll('.dropdown-content').forEach(dropdown => {
      dropdown.classList.remove('show');
    });
    document.querySelectorAll('.dropdown-btn').forEach(btn => {
      btn.classList.remove('active');
    });
  }

  function toggleStreamDropdown(slot) {
    const dropdown = document.getElementById(`dropdown-${slot}`);
    const btn = document.querySelector(`.dropdown-btn[data-slot="${slot}"]`);
    
    const wasOpen = dropdown.classList.contains('show');
    closeAllStreamDropdowns();
    
    if (!wasOpen) {
      dropdown.classList.add('show');
      btn.classList.add('active');
    }
  }

  function changeLayout(layout) {
    currentLayout = layout;
    
    const grid = document.getElementById('streamsGrid');
    grid.className = `streams-grid layout-${layout}`;
    
    for (let i = 1; i <= 4; i++) {
      const streamElement = document.getElementById(`stream-${i}`);
      const dropdownContainer = document.getElementById(`dropdown-container-${i}`);
      
      if (i <= layout) {
        if (!streamElement) {
          createStreamElement(i);
        }
        if (dropdownContainer) {
          dropdownContainer.style.display = 'block';
        }
      } else {
        if (streamElement && i > layout) {
          streamElement.remove();
        }
        if (dropdownContainer) {
          dropdownContainer.style.display = 'none';
        }
        if (activeStreams[i]) {
          delete activeStreams[i];
          const dropdownBtn = document.querySelector(`.dropdown-btn[data-slot="${i}"]`);
          if (dropdownBtn) {
            dropdownBtn.textContent = `Seleccionar evento ${i}`;
          }
        }
      }
    }
  }

  function createStreamElement(slot) {
    const grid = document.getElementById('streamsGrid');
    const existingElement = document.getElementById(`stream-${slot}`);
    
    if (existingElement) {
      return;
    }
    
    const streamElement = document.createElement('div');
    streamElement.className = 'stream-item';
    streamElement.id = `stream-${slot}`;
    
    const streamData = activeStreams[slot];
    const playerUrl = streamData ? getDirectPlayerUrl(streamData) : null;
    
    if (streamData && playerUrl) {
      streamElement.classList.add('active');
      streamElement.innerHTML = `
        <div class="stream-header">
          <div class="stream-title-bar">
            <strong>Pantalla ${slot}</strong>
            <span> - ${streamData.evento}</span>
          </div>
        </div>
        <iframe class="stream-iframe" src="${playerUrl}" allowfullscreen allow="autoplay; fullscreen"></iframe>
      `;
    } else {
      streamElement.innerHTML = `
        <div class="stream-header">
          <div class="stream-title-bar">
            <strong>Pantalla ${slot}</strong>
          </div>
        </div>
        <div class="stream-placeholder">
          <span>📺</span>
          <span>Selecciona un evento para comenzar</span>
        </div>
      `;
    }
    
    grid.appendChild(streamElement);
  }

  function selectStream(slot, stream) {
    activeStreams[slot] = stream;
    const playerUrl = getDirectPlayerUrl(stream);
    
    const dropdownBtn = document.querySelector(`.dropdown-btn[data-slot="${slot}"]`);
    if (dropdownBtn) {
      const displayText = stream.evento.length > 25 ? stream.evento.substring(0, 25) + '...' : stream.evento;
      dropdownBtn.textContent = displayText;
    }
    
    const existingElement = document.getElementById(`stream-${slot}`);
    if (existingElement) {
      if (playerUrl) {
        existingElement.classList.add('active');
        existingElement.innerHTML = `
          <div class="stream-header">
            <div class="stream-title-bar">
              <strong>Pantalla ${slot}</strong>
              <span> - ${stream.evento}</span>
            </div>
          </div>
          <iframe class="stream-iframe" src="${playerUrl}" allowfullscreen allow="autoplay; fullscreen"></iframe>
        `;
      } else {
        existingElement.classList.remove('active');
        existingElement.innerHTML = `
          <div class="stream-header">
            <div class="stream-title-bar">
              <strong>Pantalla ${slot}</strong>
              <span> - ${stream.evento}</span>
            </div>
          </div>
          <div class="stream-placeholder">
            <span>❌</span>
            <span>No se pudo cargar el reproductor</span>
          </div>
        `;
      }
    } else {
      createStreamElement(slot);
    }
    
    closeAllStreamDropdowns();
  }

  function toggleGlobalFullscreen() {
    if (!isFullscreen) {
      document.body.classList.add('fullscreen-mode');
      document.getElementById('exitFullscreenBtn').style.display = 'flex';
      isFullscreen = true;
      
      const element = document.documentElement;
      if (element.requestFullscreen) {
        element.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
      } else if (element.webkitRequestFullscreen) {
        element.webkitRequestFullscreen();
      } else if (element.mozRequestFullScreen) {
        element.mozRequestFullScreen();
      } else if (element.msRequestFullscreen) {
        element.msRequestFullscreen();
      }
    } else {
      document.body.classList.remove('fullscreen-mode');
      document.getElementById('exitFullscreenBtn').style.display = 'none';
      isFullscreen = false;
      
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(err => console.log('Exit fullscreen error:', err));
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }
  }
</script>
